name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Web dosyalarını assets'e kopyala
        run: mkdir -p android/app/src/main/assets && cp web/* android/app/src/main/assets/
      - name: Derle
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HizliOku.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HizliOku-apk
          path: HizliOku.apk
      - name: APK'yı repoya ekle (dist/)
        run: |
          mkdir -p dist && cp HizliOku.apk dist/HizliOku.apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add dist/HizliOku.apk
          git commit -m "APK derlemesi ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
